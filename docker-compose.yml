services:
  sidesubs:
    image: ghcr.io/soyxan/sidesubs:latest
    container_name: sidesubs
    restart: unless-stopped

    ports:
      - "${PORT:-8085}:8000"

    environment:
      MEDIA_PROVIDER: "${MEDIA_PROVIDER:-plex}"
      PLEX_URL: "${PLEX_URL:-http://host.docker.internal:32400}"
      PLEX_TOKEN: "${PLEX_TOKEN:?PLEX_TOKEN is required}"
      PLEX_CLIENT_FILTER: "${PLEX_CLIENT_FILTER:-}"
      POLL_INTERVAL_MS: "${POLL_INTERVAL_MS:-750}"

    extra_hosts:
      - "host.docker.internal:host-gateway"
