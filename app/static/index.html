<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>SideSubs</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
    main { width: min(900px, 100%); min-height: 100vh; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: center; gap: 26px; }
    #title, #meta, #status, #current, #next { text-align: center; }
    #title { font-size: 18px; font-weight: 700; }
    #meta { font-size: 14px; opacity: .62; }
    #current { font-size: clamp(34px, 8vw, 72px); line-height: 1.16; font-weight: 700; white-space: pre-line; text-wrap: balance; }
    #next { font-size: clamp(20px, 5vw, 36px); line-height: 1.25; opacity: .40; white-space: pre-line; text-wrap: balance; }
    #status { min-height: 18px; font-size: 13px; opacity: .42; }
    .error { font-size: 22px !important; color: #ffb1b1; }

    #controls {
      position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      z-index: 20; display: flex; align-items: center; gap: 3px; padding: 4px;
      border: 1px solid rgba(255,255,255,.15); border-radius: 999px; background: rgba(18,18,18,.74);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      transition: opacity .25s ease, transform .25s ease; white-space: nowrap; max-width: calc(100vw - 16px);
    }
    #controls.hidden-controls { opacity: .08; transform: translateX(-50%) translateY(5px) scale(.96); }
    #controls button {
      border: 0; background: transparent; color: #fff; border-radius: 999px; min-width: 32px; height: 34px;
      padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer;
    }
    #controls button:active { background: rgba(255,255,255,.14); }
    #sessionSelect, #subtitleSelect {
      height: 34px; border: 0; border-radius: 999px; padding: 0 7px; background: transparent; color: #fff;
      font: inherit; font-size: 12px; outline: none; text-overflow: ellipsis;
    }
    #sessionSelect { width: min(26vw, 125px); max-width: 125px; }
    #subtitleSelect { width: min(28vw, 145px); max-width: 145px; }
    #sessionSelect option, #subtitleSelect option { background: #181818; color: #fff; }
    #delayValue { min-width: 40px; text-align: center; font-size: 12px; opacity: .78; }
    .divider { width: 1px; height: 18px; background: rgba(255,255,255,.14); flex: 0 0 auto; }

    #cinemaNotice {
      position: fixed; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 50px); transform: translateX(-50%);
      max-width: min(92vw, 620px); padding: 8px 12px; border-radius: 12px; background: rgba(20,20,20,.82);
      font-size: 12px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    #cinemaNotice.show { opacity: .82; }

    #settingsBackdrop {
      position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
      padding: 20px; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #settingsBackdrop.show { display: flex; }
    #settingsPanel {
      width: min(420px, 100%); border: 1px solid rgba(255,255,255,.16); border-radius: 18px;
      padding: 20px; background: #151515; box-shadow: 0 18px 60px rgba(0,0,0,.5);
    }
    #settingsPanel h2 { margin: 0 0 8px; font-size: 20px; }
    #settingsPanel p { margin: 0 0 18px; font-size: 13px; line-height: 1.4; opacity: .6; }
    #settingsPanel label { display: block; margin-bottom: 7px; font-size: 13px; opacity: .8; }
    #preferredLanguageInput {
      width: 100%; height: 42px; border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
      padding: 0 12px; background: #080808; color: #fff; font: inherit; outline: none;
    }
    .settingsActions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .settingsActions button {
      min-width: 78px; height: 38px; border: 0; border-radius: 10px; padding: 0 14px; font: inherit; cursor: pointer;
    }
    #settingsCancel { background: #2a2a2a; color: #fff; }
    #settingsSave { background: #fff; color: #000; font-weight: 700; }
  </style>
</head>
<body>
<div id="cinemaNotice"></div>

<div id="settingsBackdrop">
  <div id="settingsPanel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Settings</h2>
    <p>Choose your preferred subtitle language. SideSubs will automatically select the first compatible track in this language unless you choose a specific track for the current title.</p>
    <label for="preferredLanguageInput">Preferred subtitle language</label>
    <input id="preferredLanguageInput" list="languageSuggestions" inputmode="text" autocomplete="off" placeholder="e.g. es, en, fr">
    <datalist id="languageSuggestions">
      <option value="en">English</option><option value="es">Spanish</option><option value="fr">French</option>
      <option value="de">German</option><option value="it">Italian</option><option value="pt">Portuguese</option>
      <option value="nl">Dutch</option><option value="ja">Japanese</option><option value="ko">Korean</option>
      <option value="zh">Chinese</option><option value="ar">Arabic</option><option value="ru">Russian</option>
    </datalist>
    <div class="settingsActions">
      <button id="settingsCancel" type="button">Cancel</button>
      <button id="settingsSave" type="button">Save</button>
    </div>
  </div>
</div>

<main>
  <div id="title">Connecting to Plex…</div>
  <div id="meta"></div>
  <div id="current">—</div>
  <div id="next"></div>
  <div id="status"></div>
</main>

<div id="controls">
  <select id="sessionSelect" title="Plex session"><option value="">📺 Session…</option></select>
  <div class="divider"></div>
  <select id="subtitleSelect" title="Subtitle track" disabled><option value="">💬 Subtitles…</option></select>
  <div class="divider"></div>
  <button id="settingsButton" type="button" title="Settings">⚙</button>
  <button id="cinemaButton" type="button" title="Cinema mode">▶ Cinema</button>
  <div class="divider"></div>
  <button id="delayMinus" type="button" title="Decrease delay">−</button>
  <span id="delayValue">1.0 s</span>
  <button id="delayPlus" type="button" title="Increase delay">+</button>
</div>

<script>
  const el = id => document.getElementById(id);
  let pollMs = 750;
  let wakeLock = null;
  let cinemaEnabled = false;
  let controlsTimer = null;
  let subtitleDelayMs = Number(localStorage.getItem("subtitleDelayMs") || 1000);
  let selectedPlayerId = localStorage.getItem("selectedPlayerId") || "";
  let preferredLanguage = localStorage.getItem("preferredSubtitleLanguage") || (navigator.language || "en").split("-")[0].toLowerCase();
  let subtitleSelections = JSON.parse(localStorage.getItem("subtitleSelections") || "{}");
  let currentRatingKey = "";
  let delayedQueue = [];
  let sessionRefreshTimer = null;

  subtitleDelayMs = Math.max(0, Math.min(5000, subtitleDelayMs));

  function formatTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function updateDelayLabel() {
    el("delayValue").textContent = `${(subtitleDelayMs / 1000).toFixed(1)} s`;
  }

  function setDelay(value) {
    subtitleDelayMs = Math.max(0, Math.min(5000, value));
    localStorage.setItem("subtitleDelayMs", String(subtitleDelayMs));
    delayedQueue = [];
    updateDelayLabel();
    notice(`Delay: ${(subtitleDelayMs / 1000).toFixed(1)} s`);
    showControls();
  }

  function setSelectedPlayer(playerId) {
    selectedPlayerId = playerId || "";
    currentRatingKey = "";
    delayedQueue = [];
    if (selectedPlayerId) localStorage.setItem("selectedPlayerId", selectedPlayerId);
    else localStorage.removeItem("selectedPlayerId");
  }

  function selectedSubtitleId() {
    return currentRatingKey ? (subtitleSelections[currentRatingKey] || "") : "";
  }

  function saveSubtitleSelection(ratingKey, trackId) {
    if (!ratingKey) return;
    if (trackId) subtitleSelections[ratingKey] = trackId;
    else delete subtitleSelections[ratingKey];
    localStorage.setItem("subtitleSelections", JSON.stringify(subtitleSelections));
    delayedQueue = [];
  }

  function subtitleLabel(track) {
    const language = (track.language || "und").toUpperCase();
    const source = track.source === "external" ? "SRT" : "MKV";
    const title = track.title || track.codec || "Subtitle";
    return `${language} · ${source} · ${title}${track.compatible ? "" : " · unsupported"}`;
  }

  function updateSubtitleSelector(data) {
    const select = el("subtitleSelect");
    const tracks = data.subtitle_tracks || [];
    const previousRatingKey = currentRatingKey;
    currentRatingKey = data.rating_key || "";

    select.innerHTML = '<option value="">💬 Auto</option>';
    for (const track of tracks) {
      const option = document.createElement("option");
      option.value = track.id;
      option.textContent = subtitleLabel(track);
      option.disabled = !track.compatible;
      select.appendChild(option);
    }

    let manual = selectedSubtitleId();
    if (manual && !tracks.some(track => track.id === manual && track.compatible)) {
      saveSubtitleSelection(currentRatingKey, "");
      manual = "";
    }

    select.disabled = tracks.length === 0;
    select.value = manual || data.selected_subtitle_id || "";

    if (previousRatingKey !== currentRatingKey) delayedQueue = [];
  }

  function notice(message) {
    const node = el("cinemaNotice");
    node.textContent = message;
    node.classList.add("show");
    window.clearTimeout(node._timer);
    node._timer = window.setTimeout(() => node.classList.remove("show"), 2600);
  }

  function showControls() {
    window.clearTimeout(controlsTimer);
    el("controls").classList.remove("hidden-controls");
    controlsTimer = window.setTimeout(() => el("controls").classList.add("hidden-controls"), 2800);
  }

  function openSettings() {
    el("preferredLanguageInput").value = preferredLanguage;
    el("settingsBackdrop").classList.add("show");
    window.clearTimeout(controlsTimer);
  }

  function closeSettings() {
    el("settingsBackdrop").classList.remove("show");
    showControls();
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      notice(window.isSecureContext ? "Keep screen on is not available" : "Wake Lock requires HTTPS");
      return false;
    }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
      return true;
    } catch (error) {
      notice(`Wake Lock: ${error.name}`);
      return false;
    }
  }

  async function enterFullscreen() {
    if (document.fullscreenElement) return true;
    if (!document.documentElement.requestFullscreen) {
      notice("Fullscreen is not available");
      return false;
    }
    try {
      await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      return true;
    } catch (error) {
      notice(`Fullscreen: ${error.name}`);
      return false;
    }
  }

  async function exitCinemaMode() {
    cinemaEnabled = false;
    if (wakeLock) {
      try { await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }
    if (document.fullscreenElement && document.exitFullscreen) {
      try { await document.exitFullscreen(); } catch (_) {}
    }
    el("cinemaButton").textContent = "▶ Cinema";
    showControls();
  }

  async function enterCinemaMode() {
    cinemaEnabled = true;
    const fullscreenOk = await enterFullscreen();
    const wakeOk = await requestWakeLock();
    el("cinemaButton").textContent = "✕ Cinema";
    showControls();
    if (fullscreenOk && wakeOk) notice("Cinema mode active");
    else if (fullscreenOk) notice("Fullscreen active · Wake Lock unavailable");
    else if (wakeOk) notice("Screen awake · no fullscreen");
  }

  el("settingsButton").addEventListener("click", event => {
    event.stopPropagation();
    openSettings();
  });
  el("settingsCancel").addEventListener("click", closeSettings);
  el("settingsSave").addEventListener("click", () => {
    preferredLanguage = el("preferredLanguageInput").value.trim().toLowerCase();
    localStorage.setItem("preferredSubtitleLanguage", preferredLanguage);
    delayedQueue = [];
    closeSettings();
    notice(preferredLanguage ? `Preferred language: ${preferredLanguage.toUpperCase()}` : "Automatic language preference disabled");
  });
  el("settingsBackdrop").addEventListener("pointerdown", event => {
    if (event.target === el("settingsBackdrop")) closeSettings();
  });

  el("cinemaButton").addEventListener("click", async event => {
    event.stopPropagation();
    if (cinemaEnabled) await exitCinemaMode();
    else await enterCinemaMode();
  });
  el("delayMinus").addEventListener("click", event => {
    event.stopPropagation();
    setDelay(subtitleDelayMs - 250);
  });
  el("delayPlus").addEventListener("click", event => {
    event.stopPropagation();
    setDelay(subtitleDelayMs + 250);
  });
  el("sessionSelect").addEventListener("change", event => {
    event.stopPropagation();
    setSelectedPlayer(event.target.value);
    notice(selectedPlayerId ? "Session selected" : "No session selected");
    showControls();
  });
  el("subtitleSelect").addEventListener("change", event => {
    event.stopPropagation();
    const trackId = event.target.value;
    saveSubtitleSelection(currentRatingKey, trackId);
    notice(trackId ? "Subtitle track selected" : "Automatic subtitle selection");
    showControls();
  });

  document.addEventListener("pointerdown", showControls, { passive: true });
  document.addEventListener("visibilitychange", async () => {
    if (cinemaEnabled && document.visibilityState === "visible" && !wakeLock) {
      await requestWakeLock();
      showControls();
    }
  });
  document.addEventListener("fullscreenchange", () => {
    if (cinemaEnabled && !document.fullscreenElement) {
      notice("Fullscreen disabled · Wake Lock remains active when available");
    }
  });

  function renderNoSelection(message = "Select a Plex session") {
    el("title").textContent = "No session selected";
    el("meta").textContent = "";
    el("current").textContent = "—";
    el("next").textContent = "";
    el("status").textContent = message;
    el("subtitleSelect").disabled = true;
  }

  function renderIdle() {
    if (!selectedPlayerId) {
      renderNoSelection();
      return;
    }
    el("title").textContent = "Session unavailable";
    el("meta").textContent = "";
    el("current").textContent = "—";
    el("next").textContent = "";
    el("status").textContent = "The selected session is no longer active";
    el("subtitleSelect").disabled = true;
  }

  function renderActive(data) {
    updateSubtitleSelector(data);
    el("title").textContent = data.title || "Plex";
    el("meta").textContent = `${data.client || "Plex"} · ${formatTime(data.position)} · ${data.state || ""}`;

    if (!data.media_found) {
      el("current").textContent = "Cannot access the media file";
      el("next").textContent = "";
      el("status").textContent = "Check the media path configuration";
      return;
    }

    if (!data.subtitle_found) {
      el("current").textContent = "No compatible subtitles found";
      el("next").textContent = "";
      el("status").textContent = data.subtitle_error || (data.subtitle_tracks?.length ? "Choose a compatible subtitle track" : "No subtitle tracks found");
      return;
    }

    el("current").textContent = data.current?.text || "…";
    el("next").textContent = data.next?.text || "";
    el("status").textContent = "✓ Synchronized";
  }

  function enqueueForDelayedRender(data) {
    const now = performance.now();
    delayedQueue.push({ due: now + subtitleDelayMs, data });
    while (delayedQueue.length > 1 && delayedQueue[1].due <= now) delayedQueue.shift();

    if (subtitleDelayMs === 0) {
      data.active ? renderActive(data) : renderIdle();
      delayedQueue = [];
      return;
    }
    if (delayedQueue.length && delayedQueue[0].due <= now) {
      const item = delayedQueue.shift();
      item.data.active ? renderActive(item.data) : renderIdle();
    }
  }

  async function refreshSessions() {
    try {
      const response = await fetch("/api/sessions", { cache: "no-store" });
      const data = await response.json();
      if (!data.ok) return;

      const sessions = data.sessions || [];
      const select = el("sessionSelect");
      const remembered = selectedPlayerId;
      select.innerHTML = '<option value="">📺 Session…</option>';

      for (const session of sessions) {
        const option = document.createElement("option");
        option.value = session.player_id;
        const client = session.client || session.device || session.product || "Plex";
        option.textContent = `${client} · ${session.title || "Playback"}`;
        select.appendChild(option);
      }

      if (remembered && sessions.some(item => item.player_id === remembered)) {
        select.value = remembered;
      } else if (remembered) {
        setSelectedPlayer("");
        select.value = "";
        renderNoSelection("The saved session is no longer active");
      } else {
        select.value = "";
      }
    } catch (_) {
      // /api/status will surface connectivity errors.
    } finally {
      window.clearTimeout(sessionRefreshTimer);
      sessionRefreshTimer = window.setTimeout(refreshSessions, 2000);
    }
  }

  async function refresh() {
    try {
      const manualTrack = selectedSubtitleId();
      const params = new URLSearchParams({
        player_id: selectedPlayerId,
        preferred_language: preferredLanguage,
        subtitle_id: manualTrack,
      });
      const response = await fetch(`/api/status?${params.toString()}`, { cache: "no-store" });
      const data = await response.json();
      el("current").classList.remove("error");
      if (!data.ok) throw new Error(data.error || "Unknown error");
      pollMs = data.poll_interval_ms || pollMs;
      enqueueForDelayedRender(data);
    } catch (error) {
      el("title").textContent = "Error";
      el("meta").textContent = "";
      el("current").textContent = error.message;
      el("current").classList.add("error");
      el("next").textContent = "";
      el("status").textContent = "";
    } finally {
      window.setTimeout(refresh, pollMs);
    }
  }

  updateDelayLabel();
  showControls();
  refreshSessions();
  refresh();
</script>
</body>
</html>
