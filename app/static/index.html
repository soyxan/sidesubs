<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Plex Subtitles</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(900px, 100%); min-height: 100vh; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: center; gap: 26px; }
    #title, #meta, #status, #current, #next { text-align: center; }
    #title { font-size: 18px; font-weight: 700; }
    #meta { font-size: 14px; opacity: .62; }
    #current { font-size: clamp(34px, 8vw, 72px); line-height: 1.16; font-weight: 700; white-space: pre-line; text-wrap: balance; }
    #next { font-size: clamp(20px, 5vw, 36px); line-height: 1.25; opacity: .40; white-space: pre-line; text-wrap: balance; }
    #status { min-height: 18px; font-size: 13px; opacity: .42; }
    .error { font-size: 22px !important; color: #ffb1b1; }
    #cinemaButton {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 20;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(20,20,20,.72);
      color: #fff;
      border-radius: 999px;
      padding: 10px 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity .25s ease;
    }
    #cinemaButton.dimmed { opacity: .18; }
    #cinemaNotice {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: min(92vw, 620px);
      padding: 9px 13px;
      border-radius: 12px;
      background: rgba(20,20,20,.78);
      font-size: 13px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    #cinemaNotice.show { opacity: .78; }
  </style>
</head>
<body>
<button id="cinemaButton" type="button">▶ Modo cine</button>
<div id="cinemaNotice"></div>
<main>
  <div id="title">Conectando con Plex…</div>
  <div id="meta"></div>
  <div id="current">—</div>
  <div id="next"></div>
  <div id="status"></div>
</main>
<script>
  const el = id => document.getElementById(id);
  let pollMs = 750;
  let wakeLock = null;
  let cinemaEnabled = false;
  let buttonDimTimer = null;

  function formatTime(seconds) {
    seconds = Math.max(0, Math.floor(seconds || 0));
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }

  function notice(message) {
    const node = el("cinemaNotice");
    node.textContent = message;
    node.classList.add("show");
    window.setTimeout(() => node.classList.remove("show"), 3500);
  }

  function scheduleButtonDim() {
    window.clearTimeout(buttonDimTimer);
    el("cinemaButton").classList.remove("dimmed");
    if (cinemaEnabled) {
      buttonDimTimer = window.setTimeout(() => el("cinemaButton").classList.add("dimmed"), 2500);
    }
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      notice(window.isSecureContext
        ? "Mantener pantalla activa no está disponible en este navegador"
        : "Wake Lock requiere HTTPS en este navegador");
      return false;
    }

    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
      return true;
    } catch (error) {
      notice(`No se pudo mantener la pantalla activa: ${error.name}`);
      return false;
    }
  }

  async function enterFullscreen() {
    if (document.fullscreenElement) return true;
    const target = document.documentElement;
    if (!target.requestFullscreen) {
      notice("Pantalla completa no está disponible en este navegador");
      return false;
    }
    try {
      await target.requestFullscreen({ navigationUI: "hide" });
      return true;
    } catch (error) {
      notice(`No se pudo activar pantalla completa: ${error.name}`);
      return false;
    }
  }

  async function exitCinemaMode() {
    cinemaEnabled = false;
    if (wakeLock) {
      try { await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }
    if (document.fullscreenElement && document.exitFullscreen) {
      try { await document.exitFullscreen(); } catch (_) {}
    }
    el("cinemaButton").textContent = "▶ Modo cine";
    el("cinemaButton").classList.remove("dimmed");
  }

  async function enterCinemaMode() {
    cinemaEnabled = true;
    const fullscreenOk = await enterFullscreen();
    const wakeOk = await requestWakeLock();
    el("cinemaButton").textContent = "✕ Salir cine";
    scheduleButtonDim();

    if (fullscreenOk && wakeOk) notice("Modo cine activo · pantalla completa + pantalla despierta");
    else if (fullscreenOk) notice("Modo cine activo · pantalla completa (wake lock no disponible)");
    else if (wakeOk) notice("Modo cine activo · pantalla despierta (sin fullscreen)");
  }

  el("cinemaButton").addEventListener("click", async () => {
    if (cinemaEnabled) await exitCinemaMode();
    else await enterCinemaMode();
  });

  ["pointerdown", "touchstart"].forEach(eventName => {
    document.addEventListener(eventName, scheduleButtonDim, { passive: true });
  });

  document.addEventListener("visibilitychange", async () => {
    if (cinemaEnabled && document.visibilityState === "visible" && !wakeLock) {
      await requestWakeLock();
      scheduleButtonDim();
    }
  });

  document.addEventListener("fullscreenchange", () => {
    if (cinemaEnabled && !document.fullscreenElement) {
      notice("Has salido de pantalla completa; el modo cine sigue intentando mantener la pantalla activa");
    }
  });

  function renderIdle() {
    el("title").textContent = "Sin reproducción activa";
    el("meta").textContent = "";
    el("current").textContent = "—";
    el("next").textContent = "";
    el("status").textContent = "Reproduce una película o episodio en Plex";
  }

  function renderActive(data) {
    el("title").textContent = data.title || "Plex";
    el("meta").textContent = `${data.client || "Plex"} · ${formatTime(data.position)} · ${data.state || ""}`;

    if (!data.media_found) {
      el("current").textContent = "No puedo acceder al archivo de vídeo";
      el("next").textContent = "";
      el("status").textContent = "Revisa PLEX_MEDIA_ROOT y MEDIA_PATH";
      return;
    }

    if (!data.subtitle_found) {
      el("current").textContent = "No encuentro subtítulos españoles";
      el("next").textContent = "";
      el("status").textContent = data.subtitle_error || "No se ha encontrado una pista compatible";
      return;
    }

    el("current").textContent = data.current?.text || "…";
    el("next").textContent = data.next?.text || "";
    el("status").textContent = "✓ Sincronizado";
  }

  async function refresh() {
    try {
      const response = await fetch("/api/status", { cache: "no-store" });
      const data = await response.json();
      el("current").classList.remove("error");
      if (!data.ok) throw new Error(data.error || "Error desconocido");
      pollMs = data.poll_interval_ms || pollMs;
      data.active ? renderActive(data) : renderIdle();
    } catch (error) {
      el("title").textContent = "Error";
      el("meta").textContent = "";
      el("current").textContent = error.message;
      el("current").classList.add("error");
      el("next").textContent = "";
      el("status").textContent = "";
    } finally {
      window.setTimeout(refresh, pollMs);
    }
  }

  refresh();
</script>
</body>
</html>
